<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบสถานะการยืม - ระบบยืมคืนอุปกรณ์ IT</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/2/2.1/sdk.js"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-600 text-white shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-lg font-semibold flex items-center gap-2">
        <span>📋</span> สถานะการยืมอุปกรณ์
      </h1>
      <span id="userBadge" class="text-xs bg-blue-700 px-2.5 py-1 rounded-full font-medium">กำลังโหลด...</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 py-6 flex-1 w-full flex flex-col gap-4">

    <!-- Loading State -->
    <div id="loadingState" class="flex flex-col items-center justify-center py-12 gap-3">
      <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm text-gray-500">กำลังดึงข้อมูลประวัติการยืมของคุณ...</p>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-center text-sm">
      <p id="errorMessage">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>
    </div>

    <!-- Content List -->
    <div id="contentList" class="hidden flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-medium text-gray-500">รายการยืมทั้งหมดของคุณ</h2>
        <button onclick="loadMyLoans()" class="text-xs text-blue-600 font-medium hover:underline flex items-center gap-1">
          🔄 รีเฟรช
        </button>
      </div>

      <!-- Container สำหรับใส่การ์ดรายการ -->
      <div id="loansContainer" class="flex flex-col gap-3">
        <!-- Javascript จะ render การ์ดตรงนี้ -->
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text-xs text-gray-400">
    ระบบยืม-คืนอุปกรณ์ IT © 2026
  </footer>

  <!-- Script การทำงาน -->
  <script>
    // ⚠️ ใส่ค่า CONFIG ของคุณให้ตรงกับ index.html
    const CONFIG = {
      LIFF_ID: '2012231859-0lxjeI3D',
      API_URL: 'https://script.google.com/macros/s/AKfycbxokOJDBVKK2VgM06iYhCnZ4mjPcXnN9FD-4uGx_e0qbAdsR4rPHlo-jPBZaz2tCroL/exec'
    };

    let idToken = '';

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await liff.init({ liffId: CONFIG.LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        idToken = liff.getIDToken();
        const profile = await liff.getProfile();
        document.getElementById('userBadge').innerText = profile.displayName;

        loadMyLoans();
      } catch (error) {
        showError('ไม่สามารถเริ่มต้นระบบ LIFF ได้: ' + error.message);
      }
    });

    function loadMyLoans() {
      showLoading(true);
      hideError();

      const callbackName = 'cb_' + Math.random().toString(36).substring(2);
      const script = document.createElement('script');
      
      window[callbackName] = function(response) {
        delete window[callbackName];
        document.body.removeChild(script);
        showLoading(false);

        if (response && response.success) {
          renderLoans(response.data);
        } else {
          showError(response ? response.message : 'เกิดข้อผิดพลาดในการโหลดข้อมูล');
        }
      };

      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) document.body.removeChild(script);
        showLoading(false);
        showError('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      };

      script.src = `${CONFIG.API_URL}?action=myLoans&idToken=${encodeURIComponent(idToken)}&callback=${callbackName}`;
      document.body.appendChild(script);
    }

    function renderLoans(loans) {
      const container = document.getElementById('loansContainer');
      container.innerHTML = '';

      if (!loans || loans.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl border border-gray-100 text-center flex flex-col items-center gap-2 shadow-sm">
            <span class="text-3xl">📭</span>
            <p class="text-sm font-medium text-gray-600">ยังไม่มีประวัติการยืมอุปกรณ์</p>
            <p class="text-xs text-gray-400">คุณยังไม่เคยทำรายการยืมอุปกรณ์ในระบบ</p>
          </div>
        `;
        document.getElementById('contentList').classList.remove('hidden');
        return;
      }

      loans.forEach(loan => {
        const isBorrowed = loan.status === 'BORROWED';
        const statusBadge = isBorrowed 
          ? '<span class="bg-amber-50 text-amber-700 border border-amber-200 text-xs px-2.5 py-1 rounded-full font-medium">กำลังยืม</span>'
          : '<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs px-2.5 py-1 rounded-full font-medium">คืนแล้ว</span>';

        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-3';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <span class="text-xs font-mono text-gray-400">${escapeHtml(loan.equipmentId)}</span>
              <h3 class="font-semibold text-gray-800 text-base">${escapeHtml(loan.equipmentName)}</h3>
            </div>
            <div>${statusBadge}</div>
          </div>
          <div class="text-xs text-gray-500 flex flex-col gap-1 bg-gray-50 p-2.5 rounded-xl">
            <div class="flex justify-between">
              <span>รหัสการยืม:</span>
              <span class="font-mono text-gray-700">${escapeHtml(loan.loanId)}</span>
            </div>
            <div class="flex justify-between">
              <span>วันที่ยืม:</span>
              <span>${formatDate(loan.borrowedAt)}</span>
            </div>
            <div class="flex justify-between">
              <span>กำหนดคืน:</span>
              <span class="${isBorrowed ? 'text-blue-600 font-medium' : ''}">${formatDate(loan.dueDate)}</span>
            </div>
            ${!isBorrowed && loan.returnedAt ? `
              <div class="flex justify-between text-emerald-600">
                <span>คืนเมื่อ:</span>
                <span>${formatDate(loan.returnedAt)}</span>
              </div>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('contentList').classList.remove('hidden');
    }

    function showLoading(show) {
      document.getElementById('loadingState').classList.toggle('hidden', !show);
      if (show) document.getElementById('contentList').classList.add('hidden');
    }

    function showError(message) {
      document.getElementById('errorMessage').innerText = message;
      document.getElementById('errorState').classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('errorState').classList.add('hidden');
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(#'/g, '&#039;');
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
      } catch (e) {
        return dateStr;
      }
    }
  </script>
</body>
</html>
